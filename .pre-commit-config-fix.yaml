---
# Auto-fix pre-commit hooks (MODIFYING) — run MANUALLY, never on commit:
#   pre-commit run --config .pre-commit-config-fix.yaml --all-files
# The check-only gate is .pre-commit-config.yaml. Per
# .claude/rules/pre-commit.md, run this once as a final prep step before
# committing, not mid-session in response to individual failures.
#
# Phase 1 (Core).
#
# Refresh revs with:
#   pre-commit autoupdate --config .pre-commit-config-fix.yaml

# archive/ = retired code; .vscode/syncsettings/ = machine-synced VS Code
# profile data. config/xdg-audit/{programs,json-schema}/ = the PRISTINE
# vendored xdg-ninja mirror: upstream runs no formatter, so any fixer
# (trailing-whitespace, end-of-file-fixer, prettier, ...) reformatting it would
# diverge from upstream and break the upstream-digest / --update-db comparison.
# Fenced off here so NO fix hook touches it; our own overlays (programs-local/)
# are NOT matched and stay in scope. The vendored files are still schema-
# validated in the check config + CI (duplicating upstream's validate-json gate).
exclude: '^(archive/|\.vscode/syncsettings/|config/xdg-audit/(programs|json-schema)/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # shfmt (write mode) via the combined code-tools image (ADR-0006 — replaces
  # the upstream scop/pre-commit-shfmt docker_image hook). Matches the check
  # config's shfmt, with -w to write in place (through the mounted repo).
  - repo: local
    hooks:
      # -w = write in place; flags match shfmt.md / .editorconfig.
      # shfmt does not parse .bats (@test); exclude them (see bats.md).
      - id: shfmt
        name: shfmt
        language: docker_image
        entry: ghcr.io/harleypig/code-tools:0.1.0@sha256:c91e21feab4a52a2e137eb8bfa1995c006de4f719348c82bf4e6b242f85dae45 shfmt
        args: [-w, -i, '2', -s, -bn, -ci, -sr]
        types: [shell]
        exclude: '\.bats$'
      # Extensionless sourced shell files (shell-startup, config/shell-startup/*,
      # lib/*) aren't tagged `shell` by identify (non-executable, so no shebang
      # read), so select them by path — mirrors .pre-commit-config.yaml.
      - id: shfmt-sourced
        name: shfmt (sourced shell)
        language: docker_image
        entry: ghcr.io/harleypig/code-tools:0.1.0@sha256:c91e21feab4a52a2e137eb8bfa1995c006de4f719348c82bf4e6b242f85dae45 shfmt
        args: [-w, -i, '2', -s, -bn, -ci, -sr]
        types: [text]
        files: '^(shell-startup|config/shell-startup/[^./]+|lib/[^./]+)$'

  # markdownlint --fix via the combined code-tools image (ADR-0006 — replaces
  # the upstream igorshubovych/markdownlint-cli docker_image hook). SYNC: the
  # digest matches image[markdownlint] in bin/docker_wrapper and the
  # markdownlint hook in .pre-commit-config.yaml.
  - repo: local
    hooks:
      # Auto-fix the mechanical markdown rules (blank lines, table style,
      # bare URLs, …). Rules it can't fix (MD040 code-fence language, MD013
      # line length, …) are hand-fixed and gated by the check config.
      # Uses the repo-local .markdownlint.json (auto-discovered at the root).
      - id: markdownlint-fix
        name: markdownlint --fix
        language: docker_image
        entry: ghcr.io/harleypig/code-tools:0.1.0@sha256:c91e21feab4a52a2e137eb8bfa1995c006de4f719348c82bf4e6b242f85dae45 markdownlint
        args: [--fix]
        types: [markdown]

  # Phase 3 (Language) — Python fixers (manual). Same scope-exclude as the
  # check config; flake8 has no fix variant (lint-only). Run isort before yapf.
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort

  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        args: [-i, --style, config/yapf/style]

  # Perl fixer (perltidy): ACTIVE. Same pinned PRIVATE image as the check hook
  # in .pre-commit-config.yaml (keep the tag+digest in SYNC with it and with
  # bin/docker_wrapper image[perltidy]; `docker login ghcr.io` required). It
  # formats each file in place (`-b -bext=/`, no backup); `-se` sends errors to
  # stderr instead of a stray .ERR file. Scoped to bin/ to match the check.
  - repo: local
    hooks:
      - id: perltidy
        name: perltidy -b (format in place)
        language: docker_image
        entry: ghcr.io/harleypig/perltidy:20250912@sha256:61983dd2a1c283df0b839f8fa7a45bcbca5228c7a24495567cbabc3fa997f37b perltidy -b -bext=/ -se
        files: ^bin/
        types: [perl]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      # Markdown and YAML are owned by markdownlint / yamllint; exclude them
      # so prettier does not fight those tools' formatting. (The vendored
      # xdg-audit mirror is fenced off globally — see the top-level exclude.)
      # Our own overlays (programs-local/) stay in prettier's scope and are
      # gated in the check config.
      - id: prettier
        exclude: '\.(md|markdown|ya?ml)$'
