AZURE_DEVOPS_EXT_PAT=azure
# ANTHROPIC_API_KEY is intentionally NOT exported globally: per Claude
# Code's auth precedence it overrides the Max subscription AND the
# long-lived CLAUDE_CODE_OAUTH_TOKEN below, which forced a re-login every
# ~12h. Tools that need it read private_dotfiles/api-key/anthropic
# directly (the mymcp pattern). CLAUDE_CODE_OAUTH_TOKEN is the long-lived
# `claude setup-token` for the Max subscription. Full scheme + precedence:
# the dotagents repo's rules/claude-code-auth.md.
CLAUDE_CODE_OAUTH_TOKEN=claude-code
# LINODE_TOKEN is intentionally NOT exported globally. The terraform Linode
# provider reads it, and its value selects a whole Linode ACCOUNT -- so an
# ambient one meant terraform in a customer's repo authenticated as the
# personal account. Each terraform repo now loads it in its own sourced
# `bin/set_env`, binding that repo to the right scope under
# private_dotfiles/linode/tokens/. Same reasoning as GH_TOKEN below.
OPENAI_API_KEY=openai
OPENROUTER_API_KEY=openrouter
XAI_API_KEY=grok
# Neither GH_TOKEN nor GITHUB_TOKEN is exported. One ambient PAT could not
# reach an org that owns its own resources, so GitHub credentials are kept
# one-per-scope in private_dotfiles/github/tokens and loaded per invocation
# by bin/ghx (`ghx <scope> ...`). A plain `gh` call uses gh's own stored
# OAuth credential in config/gh/hosts.yml.

# These need to be set manually on a workstation
LDAP_PASS=pass.ldap
VAULT_ADDR=vault.addr
