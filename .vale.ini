# Vale prose lint (#385). Vale runs from the code-tools image, via the
# pre-commit `vale` hook and bin/vale. StylesPath is deliberately unset: the
# image bakes the styles in and exports VALE_STYLES_PATH, so no `vale sync`
# is needed. A vale run outside the image needs the proselint style in its
# own StylesPath.
#
# Tuned to stay quiet on technical docs. Markdown code blocks, inline code
# and link URLs are already skipped by Vale's markup parsing, so only prose
# is checked. write-good is not used: on this repo's docs it raised about
# 1,470 style-opinion alerts and no errors worth acting on.

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = proselint

# TODO / FIXME / XXX are subject matter in this repo's conventions docs, not
# leftover notes.
proselint.Annotations = NO

# Flags "..." in tables and "(c)" in enumerated lists, both deliberate in
# technical text.
proselint.Typography = NO

# Its swaps replace standard technical terms (e.g. "extensible").
proselint.Needless = NO

# proselint.Cliches stays on, but "for free" (as in "load order gives it for
# free") is the ordinary technical idiom for "with no extra work", so the
# phrase is removed before linting rather than turning the whole rule off.
TokenIgnores = (\bfor free\b)
