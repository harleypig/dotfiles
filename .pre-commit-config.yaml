---
# Check-only pre-commit hooks (NON-MODIFYING) — run on `git commit` and gate
# the commit. Auto-fixers live in .pre-commit-config-fix.yaml and are run
# manually (see README + .claude/rules/pre-commit.md).
#
# Phase 1 (Core). Security / language / docs hooks are tracked in TODO.md and
# must land here before CI is allowed to gate them.
#
# trailing-whitespace / end-of-file-fixer are intentionally NOT here: those
# hooks can only fix (they modify files), which would violate "check-only".
# They live in the fix config instead.
#
# Revs are pinned. Refresh with `pre-commit autoupdate` when drift is
# suspected (see .claude/rules/pre-commit.md).

# archive/ = retired code; .vscode/syncsettings/ = machine-synced VS Code
# profile data.
exclude: '^(archive/|\.vscode/syncsettings/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Block direct commits to master locally — the server ruleset rejects
      # the push, this catches it earlier, at commit time (see git.md).
      - id: no-commit-to-branch
        args: [--branch, master]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      # VS Code's .vscode/*.json are JSONC (comments, trailing commas), which
      # check-json cannot parse; exclude them.
      - id: check-json
        exclude: '^\.vscode/'
      # Secret detection (Phase 2): catch committed private keys.
      - id: detect-private-key

  - repo: https://github.com/koalaman/shellcheck-precommit
    # Already a docker_image hook upstream (docker.io/koalaman/shellcheck) —
    # runs the pinned image at commit time, matching CI; nothing to convert.
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--external-sources]
      # Extensionless SOURCED shell files (shell-startup, config/shell-startup/*,
      # lib/*) are NOT tagged `shell` by identify — it only reads a shebang for
      # *executable* files, and these are non-executable. Select them by path.
      - id: shellcheck
        alias: shellcheck-sourced
        name: shellcheck (sourced shell)
        args: [--external-sources]
        types: [text]
        files: &sourced_shell '^(shell-startup|config/shell-startup/[^./]+|lib/[^./]+)$'

  - repo: https://github.com/scop/pre-commit-shfmt
    # shfmt-docker: the docker_image variant, so the pinned mvdan/shfmt image
    # runs at commit time (matching CI), not a host-installed binary.
    rev: v3.13.1-1
    hooks:
      # -d = diff only (non-modifying); flags match shfmt.md / .editorconfig.
      # shfmt does not parse .bats (@test); exclude them (see bats.md).
      - id: shfmt-docker
        args: [-d, -i, '2', -s, -bn, -ci, -sr]
        exclude: '\.bats$'
      # Same extensionless-sourced-shell coverage as shellcheck above.
      - id: shfmt-docker
        alias: shfmt-sourced
        name: shfmt (sourced shell)
        args: [-d, -i, '2', -s, -bn, -ci, -sr]
        types: [text]
        files: *sourced_shell

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, config/yamllint/config]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    # markdownlint-docker: the docker_image variant, so the pinned ghcr image
    # runs at commit time (matching CI and bin/markdownlint), not the host's
    # node — which the plain `markdownlint` (language: node) hook required.
    # SYNC: keep this rev in lock-step with image[markdownlint] in
    # bin/docker_wrapper and the rev in .pre-commit-config-fix.yaml; bump all
    # three together (the rev maps to the ghcr image tag).
    rev: v0.48.0
    hooks:
      # Uses the repo-local .markdownlint.json (auto-discovered at the root).
      - id: markdownlint-docker

  # Phase 3 (Language) — Python: import order, format, lint. Tools match the
  # repo's yapf + isort + flake8 choice (python.md), not black/ruff.
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--check, --diff]

  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      # 2-space style from config/yapf/style; -d = diff only (non-modifying).
      - id: yapf
        args: [-d, --style, config/yapf/style]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      # config/flake8 reconciles flake8 with yapf's 2-space style (flake8.md).
      - id: flake8
        args: [--config, config/flake8]

  # Phase 3 (Language) — Perl / perltidy: ACTIVE. Formatting is gated via the
  # pinned, self-contained docker image ghcr.io/harleypig/perltidy (built by
  # .github/workflows/publish-tool-images.yml). The image is PRIVATE, so local
  # runs and the CI pre-commit job must `docker login ghcr.io` first (see
  # WORKFLOW.md). The image has no entrypoint, so the tool is named; the check
  # tidies each file to stdout and diffs it against the source (no in-place
  # write, no stray .tdy/.ERR files), failing if any file is not tidy. Scoped
  # to bin/ (the CLIs); the hand-written tests/perl/*.t keep their own layout.
  # SYNC the tag+digest with bin/docker_wrapper image[perltidy] and the fixer
  # in .pre-commit-config-fix.yaml.
  - repo: local
    hooks:
      - id: perltidy-check
        name: perltidy (check — assert tidy)
        language: docker_image
        entry: 'ghcr.io/harleypig/perltidy:20250912@sha256:61983dd2a1c283df0b839f8fa7a45bcbca5228c7a24495567cbabc3fa997f37b sh -c ''rc=0; for f in "$@"; do perltidy -st "$f" 2>/dev/null | diff -q "$f" - >/dev/null || { echo "not tidy: $f" >&2; rc=1; }; done; exit $rc'' --'
        files: ^bin/
        types: [perl]

  # Phase 3 (Language) — Perl / perlcritic: ACTIVE. Linting is gated via the
  # pinned, self-contained (PRIVATE) docker image ghcr.io/harleypig/perlcritic
  # (built by publish-tool-images.yml; `docker login ghcr.io` required — see
  # WORKFLOW.md). perlcritic handles multiple files natively and auto-discovers
  # the repo-root .perlcriticrc (-> config/perl/perlcriticrc, the curated
  # core-severity-4 profile from F0), exiting non-zero on any violation. Scoped
  # to bin/ like perltidy. There is deliberately no in-suite Test::Perl::Critic
  # — this docker gate is the enforcement (a recorded decision). SYNC the
  # tag+digest with bin/docker_wrapper image[perlcritic] and the matrix.
  - repo: local
    hooks:
      - id: perlcritic-check
        name: perlcritic --severity 4
        language: docker_image
        entry: ghcr.io/harleypig/perlcritic:1.156@sha256:a1e4413ee095894c3ad5e72fadc10057fc955cb42a9ab05c54868ede915c6e26 perlcritic
        files: ^bin/
        types: [perl]

  # Phase 3 (Language) — Rust: N/A (no Rust in this repo).

  # Secret detection (Phase 2). The gitleaks hook scans staged content at
  # commit time — an effective local guard, but a no-op in CI's --all-files
  # run (nothing is staged there). Full-repo/history secret scanning is the
  # security-scan skill's job, not this hook.
  - repo: https://github.com/gitleaks/gitleaks
    # gitleaks-docker: the docker_image variant, so the pinned gitleaks image
    # runs at commit time (matching CI), not a host-built go binary.
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker

  # Forbid leaked tool-call markup. When a subagent is delegated a full-file
  # write, its tool-call closing tags can bleed into the file content
  # (`</content>`, `</invoke>`, `<parameter …>`) — valid text no linter
  # catches (see the dotagents repo's audit/decisions-log.md; retrospective
  # PR #166).
  # pygrep fails when the pattern matches. Anchored to a *bare tag line* so
  # prose that merely mentions the tags (this repo's audit docs) is not
  # flagged — only a standalone leaked tag is.
  - repo: local
    hooks:
      - id: forbid-tool-call-markup
        name: forbid leaked tool-call markup
        language: pygrep
        entry: '^\s*</?(?:antml:)?(?:invoke|parameter|content|function_calls)\b[^>]*>\s*$'
        types: [text]

  # Agent-config Markdown hygiene: (1) flags >78-col PROSE lines that
  # markdownlint's line_length=200 (for tables/code) lets slip through — counts
  # characters, so em-dashes aren't miscounted; exempts code/frontmatter/
  # tables/reference-links/headings/URLs; and (2) flags inline-code spans
  # broken mid-identifier (an errant internal space glued to -_/. — an
  # identifier wrapped across a line). Runs on our authored docs only —
  # vendored plugins, the cached changelog, and agent memory/plan trees are
  # excluded. Gating: the corpus is clean, so this blocks a commit / CI on any
  # new >78-col prose line or broken code span.
  - repo: local
    hooks:
      - id: prose-wrap
        name: agent-config markdown hygiene (78-col prose + code spans)
        language: system
        entry: python3 tests/lint/prose_wrap.py
        files: ^\.claude/.*\.md$
