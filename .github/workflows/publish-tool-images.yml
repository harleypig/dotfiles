---
name: publish-tool-images

# Build and push the repo's pinned QA tool images to ghcr (PRIVATE packages).
# Each matrix entry names a tool, its build context (Dockerfile dir), and its
# tag. The Perl tools (perltidy, perlcritic) share the parameterized
# config/docker/perl-tools/Dockerfile via a per-tool MODULES list - the seed of
# the roadmap's single combined tool image. ansible-lint has its own Python
# Dockerfile (config/docker/ansible-lint) and needs no MODULES. lint-tools is
# the combined cross-language linter image (config/docker/lint-tools) decided
# in ADR-0005 — its own multi-stage Dockerfile, no MODULES; tool versions are
# baked as ARG/FROM pins there, and its image tag is bumped when any of them
# changes.
#
# On a PR it BUILDS only (verify the Dockerfile); it pushes only on a push to
# master, so unmerged changes never publish. The docker_wrapper image[] pins +
# the pre-commit hooks consume these images (see bin/docker_wrapper and
# .pre-commit-config*.yaml); bump a version here and re-pin there.

on:
  push:
    branches: [master]
    paths:
      - config/docker/perl-tools/**
      - config/docker/ansible-lint/**
      - config/docker/lint-tools/**
      - .github/workflows/publish-tool-images.yml
  pull_request:
    paths:
      - config/docker/perl-tools/**
      - config/docker/ansible-lint/**
      - config/docker/lint-tools/**
      - .github/workflows/publish-tool-images.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - tool: perltidy
            context: config/docker/perl-tools
            modules: Perl::Tidy@20250912
            tag: '20250912'
          - tool: perlcritic
            context: config/docker/perl-tools
            modules: Perl::Critic@1.156
            tag: '1.156'
          - tool: ansible-lint
            context: config/docker/ansible-lint
            modules: ''
            tag: '26.6.0'
          - tool: lint-tools
            context: config/docker/lint-tools
            modules: ''
            tag: 0.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build ${{ matrix.tool }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.tool }}"
          args=()
          if [ -n "${{ matrix.modules }}" ]; then
            args+=(--build-arg "MODULES=${{ matrix.modules }}")
          fi
          docker build "${args[@]}" \
            -t "$image:${{ matrix.tag }}" "${{ matrix.context }}"

      # Push only from master (not PRs); a fork PR has no packages:write anyway.
      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push ${{ matrix.tool }}
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.tool }}:${{ matrix.tag }}"
          docker push "$image"
          docker image inspect "$image" \
            --format 'digest: {{index .RepoDigests 0}}'
