# TMPDIR on harleypig.com (config/shell-startup/claude). /tmp is tmpfs and
# empties on reboot; this one is on disk, so age out what nothing touched for
# a week. The user systemd-tmpfiles-clean.timer runs it, enabled by its
# timers.target.wants link in dotlinks-harleypig.com.
d %h/.cache/tmp 0700 - - 7d
