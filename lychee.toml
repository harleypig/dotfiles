# lychee link checker config (#452), read by bin/lychee and the pre-commit
# `lychee` hook (lychee auto-discovers lychee.toml in its working directory).
#
# Offline by default: the commit gate checks internal and relative links
# (files and #anchors) only, so a flaky external site can never block a
# commit. External links are reported as Excluded. Check them by hand with
#   bin/lychee --offline=false <files>
# which is advisory: nothing gates on it.

offline = true

# `#anchor` fragments in links to Markdown headings; offline-safe.
include_fragments = "anchor-only"

no_progress = true

# A 429 says the host is throttling us, not that the link is broken. Hosts
# that rate-limit CI runners by IP (www.gnu.org answers a single request
# with 429) would otherwise fail the online check with nothing wrong.
# Offline runs fetch nothing, so this only affects --offline=false.
accept = ["100..=103", "200..=299", "429"]
